---
name: Automated Release Tagging

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release-tag:
    name: Create Git Release Tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format!"
            echo "Use MAJOR.MINOR.PATCH, for example 1.0.0"
            exit 1
          fi

          echo "Release version is valid: $VERSION"

      - name: Check whether tag already exists
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "Tag ${TAG} already exists!"
            exit 1
          fi

          echo "Tag ${TAG} is available."

      - name: Create and push release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          echo "Successfully created release tag: $TAG"
