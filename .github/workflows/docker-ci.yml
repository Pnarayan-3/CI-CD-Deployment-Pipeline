---
name: Docker CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'app/**'
      - '.github/workflows/docker-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'app/**'
      - '.github/workflows/docker-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build-test:
    name: Docker Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t terraform-cicd-demo:${{ github.sha }} \
            .

      - name: Start Docker container
        run: |
          docker run -d \
            -p 8080:80 \
            --name terraform-demo \
            terraform-cicd-demo:${{ github.sha }}

      - name: Wait for application startup
        run: sleep 5

      - name: Validate application response
        run: |
          curl --fail http://localhost:8080 -o response.html

          grep -q "From Code to" response.html

          echo "Docker application health check passed!"

      - name: Display Docker container information
        if: always()
        run: docker ps -a

      - name: Clean up Docker container
        if: always()
        run: |
          docker stop terraform-demo || true
          docker rm terraform-demo || true
