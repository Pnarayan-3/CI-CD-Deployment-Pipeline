---
name: End-to-End CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'terraform/**'
      - '.github/workflows/end-to-end.yml'
      - 'tests/**'
      - '.github/workflows/deployment-tests.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'terraform/**'
      - '.github/workflows/end-to-end.yml'
      - 'tests/**'
      - '.github/workflows/deployment-tests.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: end-to-end-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      TF_VAR_app_name: terraform-cicd-demo
      TF_VAR_environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -no-color

  terraform-security:
    name: Terraform Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Terraform configuration with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false

  deployment-tests:
    name: Deployment Script Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run deployment tests
        run: bash tests/deployment-tests.sh
  
  pr-quality-gate:
    name: PR Quality Gate
    if: github.event_name == 'pull_request'
    needs:
      - terraform-validation
      - terraform-security
      - deployment-tests
    runs-on: ubuntu-latest

    steps:
      - name: Quality checks passed
        run: echo "All required pull request quality checks passed!"

  production-deployment:
    name: Production Deployment
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs:
      - terraform-validation
      - terraform-security
      - deployment-tests

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application to production (mock)
        run: bash scripts/deploy.sh

      - name: Run production health check
        run: bash scripts/health-check.sh

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment
          path: mock-deployment/
          if-no-files-found: error

  mock-deployment:
    name: Mock Application Deployment
    if: github.event_name == 'push'
    needs:
      - terraform-validation
      - terraform-security
      - deployment-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # release for rollback simulation.
      - name: Prepare previous release
        run: |
          mkdir -p mock-deployment/v1.0.0-previous
          echo "Previous working release" > mock-deployment/v1.0.0-previous/index.html

      - name: Deploy application
        id: deploy
        run: bash scripts/deploy.sh
        env:
          APP_VERSION: "1.0"
          BUILD_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Run deployment health check
        id: health-check
        run: bash scripts/health-check.sh

      - name: Rollback on deployment failure
        if: failure() && steps.deploy.outcome == 'success'
        run: bash scripts/rollback.sh

      - name: Upload versioned deployment artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-${{ github.run_number }}
          path: mock-deployment/
          if-no-files-found: error
          retention-days: 7

      - name: Generate deployment summary
        if: always()
        env:
          DEPLOYMENT_ENV: staging
          DEPLOYMENT_STATUS: ${{ job.status }}
          DEPLOYMENT_VERSION: v1.0.${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/deployment-summary.sh

      - name: Publish GitHub Actions summary
        if: always()
        env:
          DEPLOYMENT_ENV: staging
          DEPLOYMENT_STATUS: ${{ job.status }}
          DEPLOYMENT_VERSION: v1.0.${{ github.run_number }}
        run: |
          {
            echo "## Deployment Summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Environment | $DEPLOYMENT_ENV |"
            echo "| Status | $DEPLOYMENT_STATUS |"
            echo "| Version | $DEPLOYMENT_VERSION |"
            echo "| Commit | $GITHUB_SHA |"
          } >> "$GITHUB_STEP_SUMMARY"

  pipeline-summary:
    name: Pipeline Execution Summary
    if: always()
    needs:
      - terraform-validation
      - terraform-security
      - deployment-tests
      - pr-quality-gate
      - production-deployment
      - mock-deployment
    runs-on: ubuntu-latest

    steps:
      - name: Generate pipeline summary
        env:
          VALIDATION_STATUS: ${{ needs.terraform-validation.result }}
          SECURITY_STATUS: ${{ needs.terraform-security.result }}
          TEST_STATUS: ${{ needs.deployment-tests.result }}
          PR_STATUS: ${{ needs.pr-quality-gate.result }}
          PRODUCTION_STATUS: ${{ needs.production-deployment.result }}
          MOCK_STATUS: ${{ needs.mock-deployment.result }}
        run: |
          {
            echo "## CI/CD Pipeline Execution Summary"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Terraform Validation | $VALIDATION_STATUS |"
            echo "| Security Scan | $SECURITY_STATUS |"
            echo "| Deployment Tests | $TEST_STATUS |"
            echo "| PR Quality Gate | $PR_STATUS |"
            echo "| Production Deployment | $PRODUCTION_STATUS |"
            echo "| Mock Deployment | $MOCK_STATUS |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record execution time
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Execution Information" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow: $GITHUB_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run number: $GITHUB_RUN_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${GITHUB_SHA:0:7}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: $GITHUB_EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"

      - name: Capture deployment failure diagnostics
        if: failure()
        run: |
          echo "## Deployment Failure Diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Current deployment version" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f mock-deployment/latest-version.txt ]]; then
            cat mock-deployment/latest-version.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No deployment version found." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Deployment directory contents" >> "$GITHUB_STEP_SUMMARY"

          if [[ -d mock-deployment ]]; then
            find mock-deployment -maxdepth 3 -type f \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Deployment directory does not exist." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
