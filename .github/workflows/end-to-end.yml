---
name: End-to-End CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'terraform/**'
      - '.github/workflows/end-to-end.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'terraform/**'
      - '.github/workflows/end-to-end.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-validation:
    name: Terraform - ${{ matrix.environment }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - development
          - staging
          - production

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -var-file="${{ matrix.environment }}.tfvars"

  terraform-security:
    name: Terraform Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Terraform with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false

  pr-quality-gate:
    name: PR Quality Gate
    if: github.event_name == 'pull_request'
    needs:
      - terraform-validation
      - terraform-security
    runs-on: ubuntu-latest

    steps:
      - name: Quality checks passed
        run: echo "All required pull request quality checks passed!"

  mock-deployment:
    name: Mock Application Deployment
    if: github.event_name != 'pull_request'
    needs:
      - terraform-validation
      - terraform-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application
        run: bash scripts/deploy.sh

      - name: Run health check
        run: bash scripts/health-check.sh

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-deployment
          path: mock-deployment/
          if-no-files-found: error
